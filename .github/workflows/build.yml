name: Build icon pack APKs

on:
  push:
    branches: [ccr-1ed4b1b2-a3fwpi, main]
    paths-ignore:
      - "**.md"
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install -r requirements.txt
          python -c "import cairosvg" || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2)

      - name: Render graphite pack (My-Icon)
        run: python tools/build_pack.py --pack graphite --jobs 4

      - name: Render noir pack (My-Icon Noir)
        run: python tools/build_pack.py --pack noir --jobs 4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets (optional, otherwise signing/release.jks)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "using keystore from secrets"
          else
            echo "using signing/release.jks from the repository"
          fi

      - name: Build signed APKs (both flavors)
        working-directory: android
        run: ./gradlew --no-daemon assembleGraphiteRelease assembleNoirRelease

      - name: Verify signatures
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          cp android/app/build/outputs/apk/graphite/release/app-graphite-release.apk dist/My-Icon.apk
          cp android/app/build/outputs/apk/noir/release/app-noir-release.apk dist/My-Icon-Noir.apk
          for f in dist/*.apk; do "$BT/apksigner" verify --print-certs "$f"; done
          ls -la dist

      - name: Read versions
        id: ver
        run: |
          get() { grep "^$1=" version.properties | cut -d= -f2; }
          echo "graphite=$(get graphite.versionName)" >> "$GITHUB_OUTPUT"
          echo "noir=$(get noir.versionName)" >> "$GITHUB_OUTPUT"
          echo "icons=$(ls android/app/src/generated/res/drawable-nodpi/*.png | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: icon-packs
          path: dist/*.apk

      - name: Publish My-Icon (graphite)
        if: github.ref == 'refs/heads/ccr-1ed4b1b2-a3fwpi' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.graphite }}
          target_commitish: ${{ github.sha }}
          name: My-Icon v${{ steps.ver.outputs.graphite }}
          make_latest: true
          files: dist/My-Icon.apk
          body: |
            Графитовый icon pack: ${{ steps.ver.outputs.icons }} картинок (иконки + iconback/iconupon/iconmask).

            **Скачать:** [My-Icon.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.graphite }}/My-Icon.apk)
            (всегда последняя версия: https://github.com/${{ github.repository }}/releases/latest/download/My-Icon.apk)

            Сборка из ${{ github.sha }}. Значки — Lawnicons (Apache-2.0), стиль: `tools/iconstyle.py`.

      - name: Publish My-Icon Noir
        if: github.ref == 'refs/heads/ccr-1ed4b1b2-a3fwpi' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noir-v${{ steps.ver.outputs.noir }}
          target_commitish: ${{ github.sha }}
          name: My-Icon Noir v${{ steps.ver.outputs.noir }}
          make_latest: false
          files: dist/My-Icon-Noir.apk
          body: |
            Чёрный icon pack со сквозными значками: обои видны сквозь вырезы.
            Отдельное приложение (com.myicon.noir), ставится рядом с графитовым My-Icon.

            **Скачать:** [My-Icon-Noir.apk](https://github.com/${{ github.repository }}/releases/download/noir-v${{ steps.ver.outputs.noir }}/My-Icon-Noir.apk)

            Сборка из ${{ github.sha }}. Значки — Lawnicons (Apache-2.0), стиль: `tools/style_noir.py`.
