name: Build icon pack APKs

on:
  push:
    branches: [ccr-1ed4b1b2-a3fwpi, main]
    paths-ignore:
      - "**.md"
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install -r requirements.txt
          python -c "import cairosvg" || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2)

      - name: Render every style (Python + Pillow)
        run: |
          for p in graphite noir glass white; do
            echo "::group::$p"
            python tools/build_pack.py --pack $p --jobs 4
            echo "::endgroup::"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets (optional, otherwise signing/release.jks)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "using keystore from secrets"
          else
            echo "using signing/release.jks from the repository"
          fi

      - name: Build signed APKs (one per style, all the same app)
        working-directory: android
        run: ./gradlew --no-daemon assembleGraphiteRelease assembleNoirRelease assembleGlassRelease assembleWhiteRelease

      - name: Collect release files
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          for p in graphite noir glass white; do
            cp android/app/build/outputs/apk/$p/release/app-$p-release.apk dist/My-Icon-$p.apk
            "$BT/apksigner" verify --print-certs dist/My-Icon-$p.apk | head -2
          done
          cp dist/My-Icon-graphite.apk dist/My-Icon.apk   # old download link keeps working
          python tools/release_extras.py dist
          ls -la dist

      - name: Read version
        id: ver
        run: echo "name=$(grep '^versionName=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: my-icon
          path: dist/*

      - name: Publish release
        if: github.ref == 'refs/heads/ccr-1ed4b1b2-a3fwpi' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: My-Icon v${{ steps.ver.outputs.name }}
          make_latest: true
          files: |
            dist/*.apk
            dist/styles.json
            dist/preview-*.png
          body: |
            Одно приложение, все стили: Графит, Noir, Стекло, Белый.
            Стиль переключается в приложении (раздел «Стиль иконок»), там же обновления.

            **Скачать:** [My-Icon-white.apk](https://github.com/${{ github.repository }}/releases/latest/download/My-Icon-white.apk) ·
            [графит](https://github.com/${{ github.repository }}/releases/latest/download/My-Icon-graphite.apk) ·
            [noir](https://github.com/${{ github.repository }}/releases/latest/download/My-Icon-noir.apk) ·
            [стекло](https://github.com/${{ github.repository }}/releases/latest/download/My-Icon-glass.apk)

            Сборка из ${{ github.sha }}. Значки — Lawnicons (Apache-2.0).
