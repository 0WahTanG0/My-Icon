plugins {
    id 'com.android.application'
}

def rootDir2 = file('../..')
def versionProps = new Properties()
new File(rootDir2, 'version.properties').withInputStream { versionProps.load(it) }

// Signing: environment (GitHub secrets) wins, otherwise the keystore in signing/.
def signingProps = new Properties()
def signingPropsFile = new File(rootDir2, 'signing/keystore.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def sign = { String env, String key -> System.getenv(env) ?: signingProps.getProperty(key) }

android {
    namespace 'com.myicon.graphite'
    compileSdk 35

    defaultConfig {
        // every style is the same app: switching style installs another flavor over it
        applicationId 'com.myicon.graphite'
        minSdk 21
        targetSdk 35
        versionCode versionProps.getProperty('versionCode') as int
        versionName versionProps.getProperty('versionName')
        resValue 'string', 'app_name', 'My-Icon'
    }

    buildFeatures {
        buildConfig true
    }

    // One flavor per icon style (tools/build_pack.py --pack <flavor> renders its icons).
    flavorDimensions 'pack'
    productFlavors {
        graphite {
            dimension 'pack'
            buildConfigField 'String', 'STYLE_ID', '"graphite"'
            resValue 'string', 'style_name', 'Графит'
        }
        noir {
            dimension 'pack'
            buildConfigField 'String', 'STYLE_ID', '"noir"'
            resValue 'string', 'style_name', 'Noir'
        }
        glass {
            dimension 'pack'
            buildConfigField 'String', 'STYLE_ID', '"glass"'
            resValue 'string', 'style_name', 'Стекло'
        }
        white {
            dimension 'pack'
            buildConfigField 'String', 'STYLE_ID', '"white"'
            resValue 'string', 'style_name', 'Белый'
        }
    }

    signingConfigs {
        release {
            def store = sign('SIGNING_STORE_FILE', 'storeFile')
            storeFile store ? (new File(store).isAbsolute() ? new File(store) : new File(rootDir2, store)) : null
            storePassword sign('SIGNING_STORE_PASSWORD', 'storePassword')
            keyAlias sign('SIGNING_KEY_ALIAS', 'keyAlias')
            keyPassword sign('SIGNING_KEY_PASSWORD', 'keyPassword')
        }
    }

    buildTypes {
        release {
            // icons are looked up by name, so no code/resource shrinking
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    // icons and appfilter written by tools/build_pack.py --pack <flavor>
    sourceSets {
        graphite {
            res.srcDirs += 'src/generated/res'
            assets.srcDirs += 'src/generated/assets'
        }
        noir {
            res.srcDirs += 'src/generated-noir/res'
            assets.srcDirs += 'src/generated-noir/assets'
        }
        glass {
            res.srcDirs += 'src/generated-glass/res'
            assets.srcDirs += 'src/generated-glass/assets'
        }
        white {
            res.srcDirs += 'src/generated-white/res'
            assets.srcDirs += 'src/generated-white/assets'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
