plugins {
    id 'com.android.application'
}

def rootDir2 = file('../..')
def versionProps = new Properties()
new File(rootDir2, 'version.properties').withInputStream { versionProps.load(it) }

// Signing: environment (GitHub secrets) wins, otherwise the keystore in signing/.
def signingProps = new Properties()
def signingPropsFile = new File(rootDir2, 'signing/keystore.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def sign = { String env, String key -> System.getenv(env) ?: signingProps.getProperty(key) }

android {
    namespace 'com.myicon.graphite'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
    }

    // One flavor per icon pack: own app id (installs side by side), name and icons.
    flavorDimensions 'pack'
    productFlavors {
        graphite {
            dimension 'pack'
            applicationId 'com.myicon.graphite'
            versionCode versionProps.getProperty('graphite.versionCode') as int
            versionName versionProps.getProperty('graphite.versionName')
            resValue 'string', 'app_name', 'My-Icon'
            resValue 'string', 'subtitle', 'Графитовый icon pack'
        }
        noir {
            dimension 'pack'
            applicationId 'com.myicon.noir'
            versionCode versionProps.getProperty('noir.versionCode') as int
            versionName versionProps.getProperty('noir.versionName')
            resValue 'string', 'app_name', 'My-Icon Noir'
            resValue 'string', 'subtitle', 'Чёрный icon pack со сквозными значками'
        }
        glass {
            dimension 'pack'
            applicationId 'com.myicon.glass'
            versionCode versionProps.getProperty('glass.versionCode') as int
            versionName versionProps.getProperty('glass.versionName')
            resValue 'string', 'app_name', 'My-Icon Glass'
            resValue 'string', 'subtitle', 'Прозрачные стеклянные иконки'
        }
    }

    signingConfigs {
        release {
            def store = sign('SIGNING_STORE_FILE', 'storeFile')
            storeFile store ? (new File(store).isAbsolute() ? new File(store) : new File(rootDir2, store)) : null
            storePassword sign('SIGNING_STORE_PASSWORD', 'storePassword')
            keyAlias sign('SIGNING_KEY_ALIAS', 'keyAlias')
            keyPassword sign('SIGNING_KEY_PASSWORD', 'keyPassword')
        }
    }

    buildTypes {
        release {
            // icons are looked up by name, so no code/resource shrinking
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    // icons and appfilter written by tools/build_pack.py --pack <flavor>
    sourceSets {
        graphite {
            res.srcDirs += 'src/generated/res'
            assets.srcDirs += 'src/generated/assets'
        }
        noir {
            res.srcDirs += 'src/generated-noir/res'
            assets.srcDirs += 'src/generated-noir/assets'
        }
        glass {
            res.srcDirs += 'src/generated-glass/res'
            assets.srcDirs += 'src/generated-glass/assets'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
